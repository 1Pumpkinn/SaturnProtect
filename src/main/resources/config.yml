# SaturnProtect configuration

database:
  # SQLite file, relative to the plugin folder
  file: data.db

writer:
  # How often queued log entries are flushed to disk (milliseconds)
  flush-interval-ms: 1000
  # Max rows per insert batch
  batch-size: 500

inspector:
  # Max history lines shown when inspecting a block
  max-results: 10

ui:
  # Show /sp lookup, items and events results to players as a pop-up dialog (with Prev/Next buttons and an
  # "In chat" button). Dialogs block movement while open, so set this to false to always use chat lines.
  dialog-logs: true

lookup:
  # Lines per page (a dialog scrolls, so keep this at 10 or less if players use dialogs)
  page-size: 10
  # Radius used by /sp lookup when r: is not given (players only)
  default-radius: 10
  # Radius used by /sp near
  near-radius: 5
  # Largest radius allowed (use r:global to search everywhere)
  max-radius: 100

rollback:
  # Refuse rollbacks that match more records than this
  max-records: 250000
  # Blocks changed per server tick while rolling back (lower = less lag)
  blocks-per-tick: 500
  # Also restore container contents (from logged container changes) on rollback and restore
  containers: true

logging:
  block-break: true
  block-place: true
  buckets: true
  # Net item changes inside chests, barrels, hoppers, furnaces... per open/close
  containers: true
  item-drops: true
  # Can be noisy on busy servers
  item-pickups: false
  # Players killing players or mobs, plus players dying to mobs or the environment
  kills: true
  player-deaths: true
  # Logins and logouts
  sessions: true
  chat: true
  commands: true
  sign-edits: true
  # Blocks destroyed by creepers, TNT, beds, anchors... TNT lit by a player is logged under that player
  explosions: true
  # Blocks burned away, and fire lit by players
  fire-burn: true
  fire-ignite: true
  # Water or lava flowing over and replacing blocks like torches or redstone
  fluid-replace: true
  # Every block of new flowing water or lava. Very noisy, so off by default.
  fluid-flow: false
  # Trees and huge mushrooms growing, under the player who used bone meal if there was one
  tree-growth: true
  # Blocks pushed, pulled or destroyed by pistons, logged under #piston. Busy flying machines and
  # piston farms produce a lot of rows, turn this off if the database grows too fast.
  pistons: true
  # Endermen, withers, falling sand and gravel, sheep eating grass, trampled farmland, silverfish...
  # logged under the player or #entity_type
  entity-block-changes: true
  # Item frames, glow item frames and paintings: placed, broken, and items put in or taken out
  item-frames: true
  # Armor stands: placed, broken, and equipment put on or taken off
  armor-stands: true
  # A mob or player that dies in lava is blamed on the player who placed the nearest lava
  # within this radius and time window
  lava-attribution:
    radius: 10
    minutes: 30
  # Commands that are never logged (no slash, case-insensitive). Keep password commands here.
  ignored-commands:
    - login
    - l
    - register
    - reg
    - unregister
    - changepassword
    - sp
    - saturnprotect

purge:
  # /sp purge refuses to delete anything newer than this (w, d, h, m, s)
  minimum-age: "24h"

ignore:
  # Worlds that are never logged (case-insensitive)
  worlds: []
  # Players that are never logged (case-insensitive)
  users: []
